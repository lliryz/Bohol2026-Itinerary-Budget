    input[type=number]{-moz-appearance:textfield}
    :root{--ocean:#0e7490;--ocean-dark:#0c4a6e;--border:#e2e8f0;--stone:#f8fafc;--ink:#0f172a;--ink-mid:#334155;--ink-light:#64748b}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const PIN = "0626";
const SK_STATUS = "bohol-stop-status";
const SK_ACTUAL  = "bohol-actual-spend";

const DAYS = [
  {
    id:"d1",label:"Day 1",date:"June 5",color:"#0369a1",bg:"#e0f2fe",
    title:"Cebu → Tagbilaran → Panglao",
    budgetTitle:"Cebu → Tagbilaran → Panglao (Airbnb check-in)",
    stops:[
      {id:"s1_1",emoji:"🚢",time:"10:40 AM",name:"Ferry Cebu → Tagbilaran",tag:"Key Departure",tagType:"key",desc:"Fast craft departs at 10:40AM, arrives Tagbilaran in roughly 2 hours.",note:"⚠️ Boat fares are personal — not part of the group budget. Be at the port with time to spare."},
      {id:"s1_2",emoji:"⚓",time:"~1:00 PM",name:"Arrive — Tagbilaran Port",desc:"Disembark at Tagbilaran Port. From here, head over to Panglao — no rush, the afternoon is open."},
      {id:"s1_3",emoji:"🍽️",time:"1:00 PM – 3:00 PM",name:"Lunch + Suroy-suroy Panglao",tag:"Chill Mode",tagType:"free",desc:"Lunch anywhere along the way, then suroy-suroy — beaches, side streets, random food spots. No fixed agenda, just get a feel for the place before settling in."},
      {id:"s1_4",emoji:"🏡",time:"~3:00 PM",name:"Airbnb Check-in + Panglao Beach",tag:"Already Booked",tagType:"booked",desc:"Drop bags at the Airbnb, then head straight to the beach. Swim, sit, explore Alona Beach — the whole afternoon is free.",note:"📍 Confirm check-in time with the host. Suggested checkout on Day 2 is 11AM."},
      {id:"s1_5",emoji:"🌙",time:"Evening",name:"Dinner + Free Time",tag:"Mostly Free",tagType:"free",desc:"Dinner near the Airbnb. First night in Bohol — whatever the group feels like.",overnight:"🌙 Overnight — Panglao Airbnb"},
    ],
    budget:[
      {id:"b1_1",icon:"🏡",label:"Airbnb Check-in — Panglao",amount:4600,detail:[["Airbnb (Panglao Island)","~₱4,600"],["Status","Already booked ✓"]]},
      {id:"b1_2",icon:"🏖️",label:"Panglao Beach / Chill",amount:0,free:true,detail:[["Beach swimming, Alona Beach stroll, sunset","Free"]]},
      {id:"b1_3",icon:"🍽️",label:"Food (Day 1)",amount:3500,detail:[["Group meals (~₱500/head × 7)","~₱3,500"]]},
      {id:"b1_4",icon:"🎉",label:"Miscellaneous (Day 1)",amount:1200,detail:[["Commute from port to Panglao","~incl."],["Suroy-suroy / entrance fees","~incl."],["Snacks, convenience store runs","~incl."]]},
    ],
    total:9300,
  },
  {
    id:"d2",label:"Day 2",date:"June 6",color:"#92400e",bg:"#fef9c3",
    title:"Brunch → Checkout → Rental → Danao → Loay",
    budgetTitle:"Brunch → Checkout → Rental → Danao → Loay",
    stops:[
      {id:"s2_1",emoji:"🍳",time:"Morning",name:"Wake Up + Brunch",desc:"No alarm. Wake up naturally, have brunch near the Airbnb, and take it easy before checking out."},
      {id:"s2_2",emoji:"🏡",time:"~11:00 AM",name:"Airbnb Checkout",tag:"Suggested 11AM",tagType:"key",desc:"Pack up and settle with the host. Aiming for 11AM gives enough buffer to pick up the rental and still reach Danao by early afternoon."},
      {id:"s2_3",emoji:"🚗",time:"~11:00 AM – 12:00 NN",name:"Pick Up Car Rental + Drive to Danao",desc:"Pick up the rental, load the bags, and head north. Danao is roughly 2 to 2.5 hours from Panglao.",note:"🚗 Coordinate rental pickup time in advance. 2-day rental: June 6–7, returned on Day 4."},
      {id:"s2_4",emoji:"🎢",time:"2:00 PM – 6:00 PM",name:"Danao Adventure Park",tag:"Main Activity",tagType:"key",desc:"The main event — The Plunge. Spend the afternoon at the park, explore the grounds after the jump. See budget tab for fees.",note:"💡 Confirm slot availability at the counter upon arrival. Go straight there first before anything else."},
      {id:"s2_5",emoji:"🏘️",time:"6:00 PM onwards",name:"Drive South to Loay",tag:"Free Stay",tagType:"free",desc:"Head south to Loay after the park. Dinner somewhere along the drive — it's about 2 hours down. Early sleep; Day 3 starts at 3AM.",overnight:"🌙 Overnight — Loay (Friend's House) · Free"},
    ],
    budget:[
      {id:"b2_1",icon:"🚗",label:"Car Rental — Day 1 of 2",amount:3000,detail:[["Self-drive car rental (Day 2, June 6)","~₱3,000"]],note:"2-day rental total ₱6,000. Day 1 of 2 billed here; Day 2 of 2 on Day 3."},
      {id:"b2_2",icon:"🎢",label:"Danao Adventure Park",amount:6300,detail:[["Entrance fee (~₱50/head × 7)","~₱350"],["The Plunge — 7 pax × ₱850","₱5,950"]]},
      {id:"b2_3",icon:"🍽️",label:"Food (Day 2)",amount:3500,detail:[["Group meals (~₱500/head × 7)","~₱3,500"]]},
      {id:"b2_4",icon:"🏡",label:"Overnight Stay — Loay",amount:0,free:true,detail:[["Friend's house in Loay","₱0"]]},
    ],
    total:12800,
  },
  {
    id:"d3",label:"Day 3",date:"June 7",color:"#166534",bg:"#dcfce7",
    title:"Loay → Alicia → Anda → Cave/Falls → Loay",
    budgetTitle:"Loay → Alicia → Anda → Cave/Falls (Optional) → Loay",
    stops:[
      {id:"s3_1",emoji:"🌙",time:"3:00 AM",name:"Departure from Loay",tag:"3AM Start",tagType:"key",desc:"Very early departure from Loay. Roughly 2 hours to Alicia — arriving just before dawn beats both the heat and the crowd.",note:"⏰ Sleep early the night before. Water, snacks, and hiking shoes should be ready to go."},
      {id:"s3_2",emoji:"⛰️",time:"5:00 AM – 9:00 AM",name:"Hike — Alicia Panoramic Park",desc:"Arrive at 5AM and start the ascent. Sunrise from the summit is the reward — panoramic views of Bohol's hills and coastline. Budget around 4 hours for the full hike.",note:"🥾 Expect low visibility on the first stretch of the trail; careful footing is necessary due to slippery sections."},
      {id:"s3_3",emoji:"🏖️",time:"10:00 AM – 4:00 PM",name:"Anda Beach",desc:"White sand, crystal water. Full beach day — lunch here, swim, nap, recharge after the hike. See budget tab for fees."},
      {id:"s3_4",emoji:"🌊",time:"4:00 PM – 6:00 PM",name:"Cave / Falls near Anda",tag:"Optional",tagType:"optional",desc:"Quick stop at a cave pool or falls near Anda — Cabagnow Cave Pool is a good option. Skip this if the group is wiped out from the beach.",note:"📍 Confirm the exact spot the night before — there are a few options around Anda."},
      {id:"s3_5",emoji:"🏘️",time:"6:00 PM onwards",name:"Return to Loay",tag:"Free Stay",tagType:"free",desc:"Drive back south to Loay. Dinner on the way. Pack up that night — last morning tomorrow.",overnight:"🌙 Overnight — Loay (Friend's House) · Free"},
    ],
    budget:[
      {id:"b3_1",icon:"🚗",label:"Car Rental — Day 2 of 2",amount:3000,detail:[["Self-drive car rental (Day 3, June 7)","~₱3,000"]],note:"2nd and final day of rental. Returned on Day 4 in Tagbilaran."},
      {id:"b3_2",icon:"⛰️",label:"Alicia Panoramic Park",amount:1300,detail:[["Entrance fee (~₱100/head × 7)","~₱700"],["Guide fee","~₱600"]]},
      {id:"b3_3",icon:"🏖️",label:"Anda Beach",amount:510,detail:[["Entrance fee (~₱30/head × 7)","~₱210"],["Cottage rental","~₱300"]]},
      {id:"b3_4",icon:"🌊",label:"Cave / Falls near Anda",amount:350,optional:true,detail:[["Entrance fee (~₱50/head × 7)","~₱350"]],note:"e.g. Cabagnow Cave Pool. Skip if tired or running late."},
      {id:"b3_5",icon:"🍽️",label:"Food (Day 3)",amount:3500,detail:[["Group meals (~₱500/head × 7)","~₱3,500"]]},
      {id:"b3_6",icon:"🏡",label:"Overnight Stay — Loay",amount:0,free:true,detail:[["Friend's house in Loay","₱0"]]},
    ],
    total:8660,
  },
  {
    id:"d4",label:"Day 4",date:"June 8",color:"#9f1239",bg:"#ffe4e6",
    title:"Return Rental → Tagbilaran → Go Home",
    budgetTitle:"Return Rental → Tagbilaran → Go Home",
    stops:[
      {id:"s4_1",emoji:"🌄",time:"Morning",name:"Wake Up — Pack Up at Loay",desc:"Last morning in Bohol. Settle any remaining shared expenses, have breakfast, and say goodbye to the house."},
      {id:"s4_2",emoji:"🚗",time:"~9:00 AM – 10:00 AM",name:"Return Car Rental",tag:"Return On Time",tagType:"key",desc:"Drive to Tagbilaran for the rental drop-off. Car wash before return if the agreement requires it.",note:"🚗 Confirm the return deadline with the rental provider ahead of time — needs to line up with the ferry schedule."},
      {id:"s4_3",emoji:"🍽️",time:"~10:00 AM – 12:00 NN",name:"Last Meal in Tagbilaran",desc:"Last group meal near the port. One final sit-down before everyone heads home."},
      {id:"s4_4",emoji:"🚢",time:"Afternoon",name:"Ferry Back to Cebu — Go Home 🎉",desc:"Ferry back to Cebu. Settle any remaining shared costs on the boat. Trip's a wrap.",note:"🎉 Boat fares are personal — not in the group budget. Coordinate ferry schedules ahead of the trip."},
    ],
    budget:[
      {id:"b4_1",icon:"🍽️",label:"Food + Last Expenses",amount:2000,detail:[["Final group meal near port","~incl."],["Car rental return included in Day 2–3 cost","—"]]},
    ],
    total:2000,
  },
];

const GAS_ITEM = {id:"gas",icon:"⛽",label:"Gas + Car Wash (Whole Trip)",amount:6000,detail:[["~372 km total · Toyota Avanza · ~14 km/L","~26.6 L"],["Fuel at ~₱90/L","~₱2,500"],["Car wash before return","~₱400"],["Buffer / contingency","~₱3,100"]]};
const BUDGET_CAP = 40000;
const GRAND_TOTAL = 38760;

const MAP_LOCS = [
  {name:"Tagbilaran Port",coords:[9.6568,123.8532],desc:"Day 1 — Arrive via 10:40AM ferry",day:1},
  {name:"Panglao (Airbnb)",coords:[9.5781,123.7458],desc:"Day 1 — Check-in ~3PM",day:1},
  {name:"Danao Adventure Park",coords:[9.9357,124.1862],desc:"Day 2 — The Plunge (2–6PM)",day:2},
  {name:"Loay (Friend's House)",coords:[9.6007,124.014],desc:"Night 2 & 3 — Free stay",day:2},
  {name:"Alicia Panoramic Park",coords:[9.8942,124.5374],desc:"Day 3 — Sunrise hike (5–9AM)",day:3},
  {name:"Anda Beach",coords:[9.7434,124.5764],desc:"Day 3 — Beach day (10AM–4PM)",day:3},
  {name:"Cave/Falls near Anda",coords:[9.76,124.55],desc:"Day 3 — Optional stop",day:3},
];

// ─── localStorage helpers ─────────────────────────────────────────────────────
function lsGet(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch{return null;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(n){return"₱"+Number(n).toLocaleString();}
const TAG_STYLES={key:{bg:"#fce7f3",color:"#be185d"},free:{bg:"#dcfce7",color:"#166534"},booked:{bg:"#e0f2fe",color:"#0369a1"},optional:{bg:"#fef9c3",color:"#92400e"}};

function Tag({type,label}){
  const s=TAG_STYLES[type]||TAG_STYLES.free;
  return <span style={{fontSize:"0.68rem",fontWeight:700,padding:"2px 9px",borderRadius:999,background:s.bg,color:s.color,flexShrink:0,whiteSpace:"nowrap"}}>{label}</span>;
}

// ─── PIN MODAL ────────────────────────────────────────────────────────────────
function PinModal({onSuccess,onClose}){
  const [val,setVal]=useState("");
  const [err,setErr]=useState(false);
  function check(){
    if(val===PIN){onSuccess();onClose();}
    else{setErr(true);setVal("");setTimeout(()=>setErr(false),1200);}
  }
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.75)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)",padding:"20px"}}>
      <div style={{background:"#fff",borderRadius:20,padding:"36px 28px",width:"100%",maxWidth:320,boxShadow:"0 24px 80px rgba(0,0,0,0.25)",textAlign:"center"}}>
        <div style={{fontSize:"2rem",marginBottom:10}}>🔐</div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.25rem",fontWeight:700,marginBottom:6}}>Admin Mode</div>
        <div style={{fontSize:"0.84rem",color:"#64748b",marginBottom:22}}>Enter PIN to edit status & spending</div>
        <input type="password" maxLength={4} value={val}
          onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&check()}
          placeholder="····"
          style={{width:"100%",textAlign:"center",fontSize:"1.8rem",letterSpacing:"0.5em",padding:"12px 0",border:`2px solid ${err?"#ef4444":"#e2e8f0"}`,borderRadius:12,outline:"none",marginBottom:14,fontFamily:"monospace",transition:"border-color 0.2s"}}
          autoFocus/>
        {err&&<div style={{color:"#ef4444",fontSize:"0.82rem",marginBottom:10}}>Incorrect PIN</div>}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:"12px 0",borderRadius:10,border:"1px solid #e2e8f0",background:"#f8fafc",cursor:"pointer",fontWeight:600,fontSize:"0.9rem"}}>Cancel</button>
          <button onClick={check} style={{flex:1,padding:"12px 0",borderRadius:10,border:"none",background:"#0c4a6e",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:"0.9rem"}}>Enter</button>
        </div>
      </div>
    </div>
  );
}

// ─── STOP STATUS ──────────────────────────────────────────────────────────────
function StopStatus({stopId,status,isAdmin,onChange}){
  const s=status[stopId]||"upcoming";
  const colors={upcoming:{bg:"#f1f5f9",color:"#64748b",label:"Upcoming"},active:{bg:"#fef9c3",color:"#92400e",label:"🔴 Active"},done:{bg:"#dcfce7",color:"#166534",label:"✓ Done"}};
  const c=colors[s];
  if(!isAdmin){
    if(s==="done") return <span style={{fontSize:"0.72rem",fontWeight:700,color:"#166534",background:"#dcfce7",padding:"2px 10px",borderRadius:999,marginTop:6,display:"inline-block"}}>✓ Done</span>;
    if(s==="active") return <span style={{fontSize:"0.72rem",fontWeight:700,color:"#92400e",background:"#fef9c3",padding:"2px 10px",borderRadius:999,marginTop:6,display:"inline-block",animation:"pulse 2s infinite"}}>🔴 Active</span>;
    return null;
  }
  return(
    <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
      {["upcoming","active","done"].map(st=>(
        <button key={st} onClick={()=>onChange(stopId,st)}
          style={{padding:"5px 13px",borderRadius:999,border:`2px solid ${s===st?c.color:"#e2e8f0"}`,background:s===st?c.bg:"#fff",color:s===st?c.color:"#64748b",cursor:"pointer",fontSize:"0.74rem",fontWeight:700,transition:"all 0.15s"}}>
          {colors[st].label}
        </button>
      ))}
    </div>
  );
}

// ─── ITINERARY TAB ────────────────────────────────────────────────────────────
function ItineraryTab({status,setStatus,isAdmin}){
  const [expandedStop,setExpandedStop]=useState(null);
  const mapRef=useRef(null);
  const mapInited=useRef(false);

  useEffect(()=>{
    if(mapInited.current||!window.L||!document.getElementById("bohol-map"))return;
    setTimeout(()=>{
      if(mapInited.current)return;
      try{
        const map=L.map("bohol-map").setView([9.75,124.15],10);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
        const dc={1:"#0369a1",2:"#92400e",3:"#166534",4:"#9f1239"};
        const coords=[];
        MAP_LOCS.forEach(loc=>{
          const icon=L.divIcon({className:"",html:`<div style="width:13px;height:13px;background:${dc[loc.day]};border:2.5px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`,iconSize:[13,13],iconAnchor:[6,6]});
          L.marker(loc.coords,{icon}).addTo(map).bindPopup(`<strong>${loc.name}</strong><br><span style="color:#64748b;font-size:0.82em">Day ${loc.day} — ${loc.desc}</span>`);
          coords.push(loc.coords);
        });
        L.polyline(coords,{color:"#0e7490",weight:3,opacity:0.6,dashArray:"6 6"}).addTo(map);
        mapInited.current=true;
      }catch(e){}
    },400);
  },[]);

  function handleStatus(stopId,st){
    const next={...status,[stopId]:st};
    setStatus(next);
    lsSet(SK_STATUS,next);
  }

  const activeStop=Object.entries(status).find(([,v])=>v==="active")?.[0];

  return(
    <div>
      <section style={{padding:"32px 0 48px"}}>
        <div className="container">
          <div style={{marginBottom:22}}>
            <div style={{fontSize:"0.72rem",fontWeight:700,letterSpacing:"0.14em",textTransform:"uppercase",color:"#0e7490",marginBottom:6}}>Schedule</div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(1.6rem,5vw,2.2rem)",fontWeight:800,color:"#0f172a",marginBottom:4}}>Trip Itinerary</h2>
            <p style={{color:"#64748b",fontSize:"0.87rem"}}>Tap any stop to expand. All times approximate.{isAdmin?" Admin mode on.":""}</p>
          </div>

          {activeStop&&(
            <div style={{marginBottom:20,padding:"13px 16px",background:"linear-gradient(135deg,#fef9c3,#fef3c7)",border:"2px solid #fbbf24",borderRadius:14,display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:"1.1rem"}}>📍</span>
              <div>
                <div style={{fontWeight:700,fontSize:"0.7rem",textTransform:"uppercase",letterSpacing:"0.08em",color:"#92400e"}}>Currently Active</div>
                <div style={{fontWeight:700,color:"#0f172a",fontSize:"0.93rem"}}>{DAYS.flatMap(d=>d.stops).find(s=>s.id===activeStop)?.name||"—"}</div>
              </div>
            </div>
          )}

          <div style={{display:"flex",flexDirection:"column",gap:36}}>
            {DAYS.map(day=>(
              <div key={day.id}>
                {/* Day header */}
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                  <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",padding:"8px 14px",borderRadius:12,background:day.bg,color:day.color,fontWeight:700,textAlign:"center",flexShrink:0}}>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.55rem",lineHeight:1}}>{day.date.split(" ")[1]}</div>
                    <div style={{fontSize:"0.58rem",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:2}}>Jun · {day.label}</div>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:"0.92rem",fontWeight:700,color:"#0f172a",lineHeight:1.35}}>{day.title}</div>
                  </div>
                </div>

                {/* Stops */}
                <div style={{display:"flex",flexDirection:"column"}}>
                  {day.stops.map((stop,si)=>{
                    const st=status[stop.id]||"upcoming";
                    const isDone=st==="done";
                    const isActive=st==="active";
                    const isExpanded=expandedStop===stop.id;
                    const isLast=si===day.stops.length-1;
                    return(
                      <div key={stop.id} style={{display:"flex",gap:0,alignItems:"stretch",opacity:isDone?0.58:1,transition:"opacity 0.3s"}}>
                        {/* Left: dot + line */}
                        <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:40,flexShrink:0}}>
                          <div style={{width:34,height:34,borderRadius:"50%",flexShrink:0,background:isActive?"#fef3c7":isDone?"#dcfce7":"#f1f5f9",border:`2px solid ${isActive?"#fbbf24":isDone?"#4ade80":"#e2e8f0"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,marginTop:2,boxShadow:isActive?"0 0 0 4px rgba(251,191,36,0.18)":"none",transition:"all 0.3s",zIndex:1}}>
                            {isDone?"✓":stop.emoji}
                          </div>
                          {!isLast&&<div style={{width:2,flex:1,background:"#e2e8f0",marginTop:3}}/>}
                        </div>
                        {/* Right: content */}
                        <div style={{flex:1,paddingLeft:12,paddingBottom:isLast?4:22,minWidth:0,paddingTop:2}}>
                          <div style={{fontSize:"0.66rem",fontWeight:700,letterSpacing:"0.09em",textTransform:"uppercase",color:"#94a3b8",marginBottom:2}}>{stop.time}</div>
                          <div onClick={()=>setExpandedStop(isExpanded?null:stop.id)} style={{cursor:"pointer"}}>
                            <div style={{fontWeight:700,fontSize:"0.93rem",color:"#0f172a",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3,lineHeight:1.3}}>
                              {isDone?<s style={{color:"#94a3b8"}}>{stop.name}</s>:stop.name}
                              {isActive&&<span style={{fontSize:"0.64rem",fontWeight:700,background:"#fef9c3",color:"#92400e",padding:"2px 7px",borderRadius:999,flexShrink:0}}>🔴 Now</span>}
                            </div>
                            {stop.tag&&<div style={{marginBottom:4}}><Tag type={stop.tagType} label={stop.tag}/></div>}
                            {!isExpanded&&(
                              <div style={{fontSize:"0.83rem",color:"#94a3b8",marginTop:1}}>
                                {stop.desc.length>70?stop.desc.slice(0,70)+"… tap to read":stop.desc}
                              </div>
                            )}
                          </div>
                          {isExpanded&&(
                            <div style={{marginTop:6}}>

// ─── BUDGET ROW ───────────────────────────────────────────────────────────────
function BudgetRow({item,isOpen,onToggle}){
  return(
    <div style={{borderRadius:12,overflow:"hidden",border:"1px solid #e2e8f0"}}>
      <div onClick={onToggle} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",cursor:"pointer",background:isOpen?"#eff6ff":"#f8fafc",transition:"background 0.15s",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:9,fontWeight:600,fontSize:"0.9rem",color:"#0f172a",flex:1,minWidth:0}}>
          <span style={{width:30,height:30,borderRadius:8,background:"#e0f2fe",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{item.icon}</span>
          <span style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.label}</span>
          {item.optional&&<span style={{fontSize:"0.64rem",fontWeight:700,background:"#fef9c3",color:"#92400e",padding:"2px 7px",borderRadius:999,flexShrink:0}}>Optional</span>}

          <span style={{fontWeight:700,color:"#0c4a6e",fontSize:"0.92rem"}}>{item.amount===0?"₱0":"~"+fmt(item.amount)}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5" style={{transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",flexShrink:0}}><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      {isOpen&&(
        <div style={{padding:"12px 14px",background:"#fff",borderTop:"1px solid #e2e8f0"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            {item.detail.map(([k,v],i)=>(
              <tr key={i} style={{borderBottom:i<item.detail.length-1?"1px solid #f1f5f9":"none"}}>
                <td style={{padding:"7px 0",fontSize:"0.84rem",color:"#334155"}}>{k}</td>

          {item.note&&<p style={{fontSize:"0.78rem",color:"#64748b",marginTop:8}}>{item.note}</p>}
          <div style={{marginTop:10,padding:"9px 13px",background:"#eff6ff",borderRadius:10,fontWeight:700,color:"#0c4a6e",display:"flex",justifyContent:"space-between",fontSize:"0.85rem"}}>
            <span>Allocation</span><span>{item.amount===0?"₱0":"~"+fmt(item.amount)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── BUDGET TRACKER TAB ───────────────────────────────────────────────────────
function BudgetTrackerTab({actual,setActual,isAdmin}){
  const allItems=[
    ...DAYS.flatMap(d=>d.budget.map(b=>({...b,dayLabel:d.label,dayDate:d.date,dayColor:d.color,dayBg:d.bg}))),
    {...GAS_ITEM,dayLabel:"All Days",dayDate:"",dayColor:"#374151",dayBg:"#f3f4f6"},
  ];

  function updateActual(id,val){
    const n={...actual,[id]:val===""?"":Number(val)};
    setActual(n);
    lsSet(SK_ACTUAL,n);
  }

  const totalBudgeted=allItems.reduce((s,i)=>s+i.amount,0);
  const totalActual=allItems.reduce((s,i)=>{const v=actual[i.id];return s+(v!==""&&v!==undefined?Number(v):0);},0);
  const totalEntered=allItems.filter(i=>actual[i.id]!==""&&actual[i.id]!==undefined).length;
  const remaining=BUDGET_CAP-totalActual;
  const overBudget=totalActual>BUDGET_CAP;
  const pct=Math.min((totalActual/BUDGET_CAP)*100,100);

  const groups=[
    ...DAYS.map(d=>({day:d,items:allItems.filter(i=>i.dayLabel===d.label)})),
    {day:{label:"All Days",date:"",color:"#374151",bg:"#f3f4f6"},items:allItems.filter(i=>i.dayLabel==="All Days")},
  ];

  return(
    <section style={{padding:"32px 0 56px"}}>
      <div className="container">
        <div style={{marginBottom:22}}>
          <div style={{fontSize:"0.72rem",fontWeight:700,letterSpacing:"0.14em",textTransform:"uppercase",color:"#0e7490",marginBottom:6}}>Live Tracking</div>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(1.6rem,5vw,2.2rem)",fontWeight:800,color:"#0f172a",marginBottom:4}}>Budget Tracker</h2>
          <p style={{color:"#64748b",fontSize:"0.87rem"}}>{isAdmin?"Admin mode — tap any amount to edit.":"Read-only. Tap 🔐 Admin (top right) to log spending."}</p>
        </div>

        {/* Summary cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:24}}>
          {[
            {label:"Budgeted",val:fmt(totalBudgeted),sub:"total planned",color:"#0c4a6e",bg:"#e0f2fe"},
            {label:"Spent",val:fmt(totalActual),sub:`${totalEntered}/${allItems.length} logged`,color:overBudget?"#9f1239":"#166534",bg:overBudget?"#ffe4e6":"#dcfce7"},
            {label:overBudget?"Over Budget":"Remaining",val:fmt(Math.abs(remaining)),sub:"vs ₱40k cap",color:overBudget?"#9f1239":"#166534",bg:overBudget?"#ffe4e6":"#f0fdf4"},
            {label:"Budget Cap",val:"₱40,000",sub:"group total",color:"#374151",bg:"#f3f4f6"},
          ].map((s,i)=>(
            <div key={i} style={{background:s.bg,borderRadius:14,padding:"14px 16px"}}>
              <div style={{fontSize:"0.66rem",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:s.color,opacity:0.7,marginBottom:5}}>{s.label}</div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.4rem",fontWeight:700,color:s.color,lineHeight:1}}>{s.val}</div>
              <div style={{fontSize:"0.72rem",color:s.color,opacity:0.65,marginTop:3}}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* Progress bar */}
        <div style={{marginBottom:28}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.78rem",fontWeight:600,color:"#64748b",marginBottom:6}}>
            <span>Spent: {fmt(totalActual)}</span><span>Cap: {fmt(BUDGET_CAP)}</span>
          </div>
          <div style={{height:10,background:"#e2e8f0",borderRadius:999,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:overBudget?"#ef4444":pct>85?"#f59e0b":"#22c55e",borderRadius:999,transition:"width 0.4s ease"}}/>
          </div>
          <div style={{fontSize:"0.74rem",color:"#94a3b8",marginTop:5,textAlign:"right"}}>{Math.round(pct)}% of budget used</div>
        </div>

        {/* Groups */}
        {groups.map(({day,items})=>{
          const groupBudget=items.reduce((s,i)=>s+i.amount,0);
          const groupActual=items.reduce((s,i)=>{const v=actual[i.id];return s+(v!==""&&v!==undefined?Number(v):0);},0);
          const diff=groupActual-groupBudget;
          return(
            <div key={day.label} style={{marginBottom:16,background:"#fff",borderRadius:18,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 3px 16px rgba(15,23,42,0.04)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:"linear-gradient(90deg,#f8fafc,#fff)",borderBottom:"1px solid #e2e8f0",flexWrap:"wrap",gap:8}}>
                <span style={{padding:"3px 11px",borderRadius:999,fontSize:"0.68rem",fontWeight:700,background:day.bg,color:day.color,flexShrink:0}}>{day.label}{day.date?` — ${day.date}`:""}</span>
                <div style={{display:"flex",gap:10,fontSize:"0.82rem",flexWrap:"wrap"}}>
                  <span style={{color:"#64748b"}}>Budget: <strong style={{color:"#0c4a6e"}}>{fmt(groupBudget)}</strong></span>
                  <span style={{color:"#64748b"}}>Actual: <strong style={{color:groupActual>groupBudget?"#9f1239":"#166534"}}>{fmt(groupActual)}</strong></span>
                  {diff!==0&&<span style={{color:diff>0?"#9f1239":"#166534",fontWeight:700}}>{diff>0?"+":""}{fmt(diff)}</span>}
                </div>
              </div>
              <div style={{padding:"8px 12px",display:"flex",flexDirection:"column",gap:6}}>
                {items.map(item=>{
                  const v=actual[item.id];
                  const hasVal=v!==""&&v!==undefined;
                  const over=hasVal&&Number(v)>item.amount;
                  const under=hasVal&&Number(v)<item.amount;
                  return(
                    <div key={item.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#f8fafc",borderRadius:10,border:"1px solid #e2e8f0",flexWrap:"wrap"}}>
                      <span style={{fontSize:15,flexShrink:0}}>{item.icon}</span>
                      <div style={{flex:1,minWidth:100}}>
                        <div style={{fontWeight:600,fontSize:"0.87rem",color:"#0f172a",lineHeight:1.3}}>{item.label}</div>
                        <div style={{fontSize:"0.73rem",color:"#94a3b8"}}>Budget: {item.amount===0?"₱0 (free)":"~"+fmt(item.amount)}</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}>
                        {isAdmin?(
                          <div style={{position:"relative"}}>
                            <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#64748b",fontWeight:600,fontSize:"0.88rem",pointerEvents:"none"}}>₱</span>
                            <input type="number" min={0} value={v??""} onChange={e=>updateActual(item.id,e.target.value)} placeholder="0"
                              style={{width:110,paddingLeft:22,paddingRight:8,paddingTop:7,paddingBottom:7,borderRadius:9,border:`2px solid ${over?"#fca5a5":under?"#86efac":"#e2e8f0"}`,fontSize:"0.88rem",fontWeight:600,outline:"none",background:"#fff",color:"#0f172a"}}/>
                          </div>
                        ):(
                          <div style={{padding:"7px 12px",borderRadius:9,border:"2px solid #e2e8f0",fontSize:"0.88rem",fontWeight:600,color:hasVal?"#0f172a":"#94a3b8",background:"#fff",minWidth:90,textAlign:"right"}}>
                            {hasVal?fmt(Number(v)):"—"}
                          </div>
                        )}
                        {hasVal&&(
                          <span style={{fontSize:"0.72rem",fontWeight:700,padding:"3px 8px",borderRadius:999,background:over?"#ffe4e6":"#dcfce7",color:over?"#9f1239":"#166534",whiteSpace:"nowrap"}}>
                            {over?`+${fmt(Number(v)-item.amount)}`:under?`-${fmt(item.amount-Number(v))}`:"✓"}
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}

        {!isAdmin&&(
          <div style={{textAlign:"center",marginTop:16,padding:"16px",background:"#f8fafc",borderRadius:14,border:"1px solid #e2e8f0",color:"#64748b",fontSize:"0.86rem"}}>
            🔐 Tap Admin (top right) to log actual spending
          </div>
        )}
      </div>
    </section>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("itinerary");
  const [status,setStatus]=useState(()=>lsGet(SK_STATUS)||{});
  const [actual,setActual]=useState(()=>lsGet(SK_ACTUAL)||{});
  const [isAdmin,setIsAdmin]=useState(false);
  const [showPin,setShowPin]=useState(false);

  const doneCount=Object.values(status).filter(v=>v==="done").length;
  const totalStops=DAYS.reduce((s,d)=>s+d.stops.length,0);

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif",background:"#f8fafc",color:"#0f172a",lineHeight:1.6,minHeight:"100vh"}}>
      {showPin&&<PinModal onSuccess={()=>setIsAdmin(true)} onClose={()=>setShowPin(false)}/>}

      {/* HERO */}
      <header style={{position:"relative",background:"#0c4a6e",overflow:"hidden",padding:"64px 0 50px"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 80% 60% at 70% 100%,rgba(14,116,144,0.6),transparent 70%),radial-gradient(ellipse 50% 80% at 10% 50%,rgba(56,189,248,0.15),transparent 60%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:60,overflow:"hidden"}}>
          <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style={{width:"100%",height:"100%"}}>
            <path d="M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z" fill="#f8fafc"/>
          </svg>
        </div>
        <div className="container" style={{position:"relative",zIndex:1}}>
          <div style={{fontSize:"0.78rem",fontWeight:600,letterSpacing:"0.14em",textTransform:"uppercase",color:"#38bdf8",marginBottom:8}}>Bohol, Philippines — June 5–8, 2026</div>
          <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(2.4rem,8vw,4.5rem)",fontWeight:800,lineHeight:1.05,color:"#fff",marginBottom:8}}>Bohol Trip w D1s</h1>
          <div style={{fontSize:"clamp(1rem,3vw,1.4rem)",fontWeight:500,color:"rgba(255,255,255,0.7)",marginBottom:24}}>4 Days · 7 Pax · ₱40k Budget</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
            {[
              {h:"₱40k",p:"Budget cap"},
              {h:"7 Pax",p:"Group size"},
              {h:"4 Days",p:"June 5–8"},
              {h:"~₱38.8k",p:"Estimated total"},
              {h:`${doneCount}/${totalStops}`,p:"Stops done"},
            ].map((s,i)=>(
              <div key={i} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.14)",padding:"15px 16px",borderRadius:16,backdropFilter:"blur(6px)"}}>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.6rem",fontWeight:700,color:"#fff",marginBottom:3}}>{s.h}</div>
                <div style={{fontSize:"0.76rem",color:"rgba(255,255,255,0.6)",fontWeight:500}}>{s.p}</div>
              </div>
            ))}
          </div>
        </div>
      </header>

      {/* STICKY TABS */}
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(15,23,42,0.07)"}}>
        <div className="container" style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
            {[
              {id:"itinerary",label:"🗺️ Itinerary"},
              {id:"budget",label:"💰 Budget"},
              {id:"tracker",label:"📊 Tracker"},
            ].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{padding:"14px 16px",fontFamily:"'DM Sans',sans-serif",fontSize:"0.88rem",fontWeight:600,color:tab===t.id?"#0c4a6e":"#64748b",background:"none",border:"none",borderBottom:`3px solid ${tab===t.id?"#0e7490":"transparent"}`,cursor:"pointer",transition:"color 0.18s,border-color 0.18s",whiteSpace:"nowrap",flexShrink:0}}>
                {t.label}
              </button>
            ))}
          </div>
          <button onClick={()=>isAdmin?setIsAdmin(false):setShowPin(true)}
            style={{padding:"7px 13px",borderRadius:9,border:`2px solid ${isAdmin?"#166534":"#e2e8f0"}`,background:isAdmin?"#dcfce7":"#f8fafc",color:isAdmin?"#166534":"#64748b",cursor:"pointer",fontWeight:700,fontSize:"0.78rem",display:"flex",alignItems:"center",gap:5,transition:"all 0.2s",flexShrink:0,marginLeft:4,marginRight:2}}>
            {isAdmin?"🔓 Admin":"🔐 Admin"}
          </button>
        </div>
      </div>

      {/* PANELS */}
      {tab==="itinerary"&&<ItineraryTab status={status} setStatus={setStatus} isAdmin={isAdmin}/>}
      {tab==="budget"&&<BudgetPlanTab/>}
      {tab==="tracker"&&<BudgetTrackerTab actual={actual} setActual={setActual} isAdmin={isAdmin}/>}

      <footer style={{background:"#0f172a",color:"#94a3b8",textAlign:"center",padding:"28px 20px",fontSize:"0.84rem"}}>
        <span style={{color:"#38bdf8",fontWeight:600}}>Bohol Trip w D1s</span> — June 2026
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
